name: Package and release

# Pushing a tag (v1.2.3) builds the zip and creates the GitHub release.
# CurseForge packages the same tag itself through its repository webhook.
# "Run workflow" builds a test package only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases are cut from main: a tag on any other commit is refused.
      - name: Check the tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main. Merge to main first, then tag."
            exit 1
          }

      # A failing scenario test stops the GitHub release.
      - name: Run tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          lua5.1 tests/run.lua .

      - name: Package and release
        uses: BigWigsMods/packager@v2
