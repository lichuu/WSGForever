name: Tests

# Scenario tests on every branch push and pull request. main only accepts
# commits this has passed on.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          lua5.1 tests/run.lua .
